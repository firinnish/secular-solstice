<!DOCTYPE html>
<html lang="en" data-version="flames">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secular Solstice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Effects used by the page (invisible) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Stars: hide light below the threshold, make light above it fully bright (set by scene.js) -->
  <filter id="star-threshold" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="linear"/><feFuncG type="linear"/><feFuncB type="linear"/>
    </feComponentTransfer>
  </filter>
  <!-- Torch flames: a slowly shifting ripple that bends the painted flames -->
  <filter id="flame-warp-l" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.09" numOctaves="2" seed="3" result="n">
      <animate attributeName="baseFrequency" dur="2.3s" repeatCount="indefinite"
               values="0.04 0.09; 0.05 0.07; 0.035 0.1; 0.04 0.09"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="flame-warp-r" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05 0.1" numOctaves="2" seed="11" result="n">
      <animate attributeName="baseFrequency" dur="1.9s" repeatCount="indefinite"
               values="0.05 0.1; 0.04 0.08; 0.055 0.11; 0.05 0.1"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="scene">
  <!-- Top 25%: sky painting (dim, brightening where the fire reaches) and stars -->
  <div class="sky-band">
    <img class="sky-base" src="sky-band.png" alt="">
    <div class="lit sky-lit">
      <img src="sky-band.png" alt="">
      <canvas class="fire"></canvas>
    </div>
    <img class="stars-base" src="stars-band.png" alt="">
    <div class="lit stars-lit">
      <img src="stars-band.png" alt="">
      <canvas class="fire"></canvas>
    </div>
  </div>

  <!-- Warm firelight over the whole background -->
  <div class="layer opt-glow"><canvas class="fire"></canvas></div>

  <!-- Title: smudge (only where firelit), lettering, fire glowing through the lettering -->
  <div class="title-box">
    <div class="lit smudge-lit">
      <img src="smudge.png" alt="">
      <canvas class="fire"></canvas>
    </div>
    <img class="text-base" src="text.png" alt="Secular Solstice">
    <div class="text-fire" aria-hidden="true"><canvas class="fire"></canvas></div>
  </div>

  <!-- Visible flames rising from the bottom edge -->
  <div class="layer opt-flames"><canvas class="fire"></canvas></div>

  <!-- Bottom 25%: the people, with flickering torches -->
  <div class="people-box">
    <div class="torch left"></div>
    <div class="torch right"></div>
    <img class="people-base" src="people-base.png" alt="">
    <img class="flame left" src="flame-left.png" alt="">
    <img class="flame right" src="flame-right.png" alt="">
  </div>
</div>

<script src="scene.js"></script>
</body>
</html>
